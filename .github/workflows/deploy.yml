name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$PROD_HOST" ]; then
            echo "Missing GitHub Actions secret: PROD_HOST"
            exit 1
          fi

          if [ -z "$PROD_SSH_KEY" ]; then
            echo "Missing GitHub Actions secret: PROD_SSH_KEY"
            exit 1
          fi

          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -T 15 -p "$PROD_SSH_PORT" "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          APP_DIR: /home/production/apps/prod_test
          BRANCH: main
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [ -z "$PROD_USER" ]; then
            echo "Missing GitHub Actions secret: PROD_USER"
            exit 1
          fi

          PROD_SSH_PORT="${PROD_SSH_PORT:-22}"

          ssh -i ~/.ssh/prod_key -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" \
            "APP_DIR='$APP_DIR' BRANCH='$BRANCH' REPO_URL='$REPO_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git reset --hard "origin/$BRANCH"

          sudo systemctl daemon-reload
          sudo systemctl restart prod_test.service
          sudo systemctl status prod_test.service --no-pager

          curl -fsS http://127.0.0.1:8000/api/health
          REMOTE
